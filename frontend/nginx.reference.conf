# Portal nginx config. nginx:alpine renders this template with envsubst at startup:
# installed as /etc/nginx/templates/default.conf.template -> /etc/nginx/conf.d/default.conf.
# Only these variables are substituted (NGINX_ENVSUBST_FILTER in the Dockerfile), so nginx's own
# $variables are left alone. CONSOLE_KEY comes from the Secret shared with lambda-api-mock.
#
# The browser never holds the console key: it is injected here. To stop other sites from using it
# (CSRF from a page that POSTs to this port, DNS rebinding that reads the answers):
#   1. The key is added only when the request has no Authorization header, carries
#      `X-Lambda-Console: 1` (set by the portal's own client) and Sec-Fetch-Site is absent,
#      same-origin or none. A custom header makes a cross-site fetch preflight, and this server
#      never answers a preflight with Access-Control-Allow-* headers, so the browser refuses to send it.
#      Anything else goes upstream without the key and gets the normal 401.
#   2. Only hosts matching PORTAL_ALLOWED_HOSTS are served (421 otherwise), which defeats rebinding.
# Requests that bring their own Authorization (playground calls with a user's key) keep it.

# Access log with the Host header, so the first live run can confirm the Instruqt proxy host.
log_format portal '$remote_addr host=$host "$request" $status sfs=$http_sec_fetch_site ref="$http_referer"';
access_log /dev/stdout portal;

map $host $portal_host_ok {
    "~${PORTAL_ALLOWED_HOSTS}" 1;
    default                    0;
}

map $http_sec_fetch_site $portal_same_site {
    ""          1;
    same-origin 1;
    none        1;
    default     0;
}

# "<has Authorization>:<X-Lambda-Console>:<same site>"
map "$http_authorization:$http_x_lambda_console:$portal_same_site" $portal_authorization {
    ":1:1"  "Bearer ${CONSOLE_KEY}";
    "~^:"   "";
    default $http_authorization;
}

server {
    listen 8080;
    # Resolve the upstreams per request (not once at startup), so the console starts even when the mock or
    # the adapter Service is not up yet. RESOLVER is the cluster DNS (kube-dns ClusterIP), from the env.
    resolver ${RESOLVER} valid=10s ipv6=off;
    set $mock_upstream ${MOCK_URL};
    set $adapter_upstream ${ADAPTER_URL};
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # DNS-rebinding guard: only the portal's own host names are served.
    if ($portal_host_ok = 0) { return 421; }

    # Cluster-internal endpoints: never reachable through the portal.
    location = /internal/v1/introspect   { return 404; }
    location = /internal/v1/audit-events { return 404; }

    # Inference gateway and network firewall APIs (adapter). Longest prefix wins over /api/v1/ below.
    location /api/v1/network-firewall- {
        proxy_pass $adapter_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $portal_authorization;
    }

    location /api/v1/inference- {
        proxy_pass $adapter_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $portal_authorization;
        proxy_buffering off;              # streamed chat completions
        proxy_read_timeout 300s;
    }

    location /api/v1/ {
        proxy_pass $mock_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $portal_authorization;
    }

    location /internal/v1/ {
        proxy_pass $mock_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $portal_authorization;
    }

    # The API contracts (Adopt page). Plain text, so a browser tab shows them and Cmd/Ctrl+S saves them:
    # nginx has no .yaml type and sent application/octet-stream, which a tab treats as a download, and the
    # Instruqt frame blocks downloads (seen live: an empty tab).
    location /adoption/ {
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
