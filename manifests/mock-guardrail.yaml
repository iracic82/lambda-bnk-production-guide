# Mock Calypso AI guardrail in lambda-ie: the lab's 41-mock-calypso.yaml (bnk-ai-kv-lab), same image, code
# and port. The BNK guardrail iRule POSTs the prompt to /backend/v1/scans over a sideband and enforces
# {"outcome": "flagged"|"pass"}. The adapter's GUARDRAIL_URL points at this Service's ClusterIP (fill
# it in at install time) because iRules cannot resolve DNS. Lab and trials only: it flags by keyword.
apiVersion: v1
kind: ConfigMap
metadata: {name: mock-calypso-code, namespace: lambda-ie}
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    # A prompt that contains any of these is flagged. Kept short and obvious for a demo.
    BLOCK = ["hack", "password", "credit card", "social security", "bomb", "exploit",
             "malware", "ransomware", "sql injection", "ddos", "steal", "weapon"]

    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _send(self, obj, code=200):
            raw = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def do_POST(self):
            n = int(self.headers.get("Content-Length", "0"))
            body = self.rfile.read(n).decode("utf-8", "replace").lower()
            flagged = any(k in body for k in BLOCK)
            self._send({"outcome": "flagged" if flagged else "pass"})

        def do_GET(self):
            if self.path == "/healthz":
                self._send({"ok": True})
            else:
                self._send({"error": "not found"}, 404)

        def log_message(self, *a):
            return

    if __name__ == "__main__":
        print("mock-calypso on :8080", flush=True)
        ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mock-calypso, namespace: lambda-ie, labels: {app: mock-calypso}}
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-calypso}}
  template:
    metadata: {labels: {app: mock-calypso}}
    spec:
      automountServiceAccountToken: false
      # python:3.12-slim defaults to root; run as nobody (numeric, so runAsNonRoot can be verified).
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: server
          image: python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f   # pinned (third-party)
          command: ["python3", "/app/server.py"]
          env: [{name: PYTHONDONTWRITEBYTECODE, value: "1"}]
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: code, mountPath: /app, readOnly: true}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "250m", memory: "128Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes: [{name: code, configMap: {name: mock-calypso-code}}]
---
apiVersion: v1
kind: Service
metadata: {name: mock-calypso-svc, namespace: lambda-ie}
spec:
  selector: {app: mock-calypso}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
# Only the TMM sideband (guardrail iRule) and the adapter may call the guardrail.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mock-calypso-ingress, namespace: lambda-ie}
spec:
  podSelector: {matchLabels: {app: mock-calypso}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.1.20.201/32}   # TMM internal self-IP (iRule guardrail sideband source)
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: f5-bnk}}
          podSelector: {matchLabels: {app: f5-tmm}}   # TMM by identity: its iRule sidebands leave from its pod IP, which changes when TMM is recreated
        - podSelector: {matchLabels: {app: bnk-inference-adapter}}
      ports: [{port: 8080}]
